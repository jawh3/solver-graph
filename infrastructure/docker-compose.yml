services:
  mongodb:
    image: mongo:6.0
    container_name: ctf_mongodb
    restart: always
    command: ["mongod", "--bind_ip_all"]
    ports:
      - "0.0.0.0:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-example}
    volumes:
      - ./data/mongodb_data:/data/db
